# One stack per folder. Compose names the project after the folder, so each
# git worktree gets its own containers, volumes and Tailscale hostname.
# No host ports are published: every stack is reached over the tailnet at
#   https://${COMPOSE_PROJECT_NAME}.<tailnet>.ts.net      (Tailscale Serve -> :8000)
#   http://${COMPOSE_PROJECT_NAME}:8000                    (MagicDNS, direct)

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${COMPOSE_PROJECT_NAME}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${COMPOSE_PROJECT_NAME}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  app:
    build: ./app
    # Share the sidecar's network namespace: the app's :8000 is the
    # tailnet node's :8000, and it still reaches `db` on the Compose network.
    network_mode: service:tailscale
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    volumes:
      - ./app:/app
    depends_on:
      tailscale:
        condition: service_started
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      # Dev-only values: the database is private to this stack, so they aren't secrets.
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  tailscale-state:
  db-data:
